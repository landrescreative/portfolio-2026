<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020307" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a00" />
      <stop offset="100%" stop-color="#ff8c38" />
    </linearGradient>
    <linearGradient id="terminalBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="337" r="280" fill="#ff5a00" opacity="0.08" filter="url(#glow)" />
  <circle cx="950" cy="180" r="180" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />

  <!-- Main Terminal Window -->
  <g transform="translate(180, 100)">
    <!-- Terminal Shadow & Border -->
    <rect width="840" height="475" rx="16" fill="#0c1322" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="840" height="48" rx="16" fill="url(#terminalBar)" />
    <rect y="32" width="840" height="16" fill="url(#terminalBar)" />
    <line x1="0" y1="48" x2="840" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#eab308" />
    <circle cx="68" cy="24" r="6" fill="#22c55e" />
    
    <!-- Tab Title -->
    <text x="420" y="29" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
      alex@production-node-01: ~ /nginx-cluster
    </text>

    <!-- Terminal Content -->
    <g transform="translate(36, 85)" font-family="monospace" font-size="15" letter-spacing="0.5">
      <!-- Line 1 -->
      <text y="0" fill="#ff5a00" font-weight="bold">➜</text>
      <text x="24" y="0" fill="#38bdf8" font-weight="600">~</text>
      <text x="44" y="0" fill="#f8fafc">systemctl status nginx --no-pager</text>
      
      <!-- Line 2 -->
      <text y="32" fill="#22c55e">●</text>
      <text x="20" y="32" fill="#22c55e" font-weight="bold">nginx.service</text>
      <text x="145" y="32" fill="#94a3b8">- High Performance Reverse Proxy &amp; Load Balancer</text>
      
      <!-- Line 3 -->
      <text x="20" y="58" fill="#64748b">   Loaded: loaded (/etc/systemd/system/nginx.service; enabled)</text>
      <text x="20" y="82" fill="#64748b">   Active: </text>
      <text x="95" y="82" fill="#22c55e" font-weight="bold">active (running)</text>
      <text x="240" y="82" fill="#64748b">since Wed 2026-09-28 04:12:08 UTC; 99.99% Uptime</text>

      <!-- Line 4 -->
      <text y="130" fill="#ff5a00" font-weight="bold">➜</text>
      <text x="24" y="130" fill="#38bdf8" font-weight="600">~</text>
      <text x="44" y="130" fill="#f8fafc">docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"</text>

      <!-- Docker Table -->
      <text x="20" y="165" fill="#94a3b8" font-weight="600">NAMES                STATUS              PORTS</text>
      <text x="20" y="195" fill="#38bdf8">prod-web-frontend</text>
      <text x="200" y="195" fill="#22c55e">Up 42 days (healthy)</text>
      <text x="390" y="195" fill="#f8fafc">0.0.0.0:443->443/tcp (SSL/TLS 1.3)</text>

      <text x="20" y="222" fill="#38bdf8">prod-api-gateway</text>
      <text x="200" y="222" fill="#22c55e">Up 42 days (healthy)</text>
      <text x="390" y="222" fill="#f8fafc">127.0.0.1:8080->8080/tcp</text>

      <text x="20" y="249" fill="#38bdf8">redis-cache-cluster</text>
      <text x="200" y="249" fill="#22c55e">Up 42 days (healthy)</text>
      <text x="390" y="249" fill="#f8fafc">127.0.0.1:6379->6379/tcp</text>

      <!-- Line 5 -->
      <text y="298" fill="#ff5a00" font-weight="bold">➜</text>
      <text x="24" y="298" fill="#38bdf8" font-weight="600">~</text>
      <text x="44" y="298" fill="#f8fafc">curl -I https://nexteradevelopments.com | grep HTTP</text>
      <text x="20" y="326" fill="#22c55e" font-weight="bold">HTTP/2 200 OK  [TTFB: 28ms · Brotli: Enabled · SSL: A+]</text>
    </g>
  </g>
</svg>
