<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a00" />
      <stop offset="100%" stop-color="#ff9040" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#archBg)" />
  
  <!-- Title -->
  <text x="600" y="70" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2">
    ENTERPRISE LINUX &amp; NGINX CLUSTER ARCHITECTURE
  </text>
  <text x="600" y="100" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle" letter-spacing="1">
    Zero-Downtime Deployment · SSL/TLS 1.3 Termination · Edge Caching &amp; Security Layer
  </text>

  <!-- Client Node -->
  <g transform="translate(100, 260)">
    <rect width="180" height="130" rx="12" fill="#111827" stroke="#ff5a00" stroke-width="2" />
    <text x="90" y="55" fill="#ff5a00" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Worldwide Traffic</text>
    <text x="90" y="85" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">HTTPS Requests</text>
    <text x="90" y="105" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Cloudflare CDN</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 285 325 L 415 325" stroke="#ff5a00" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- NGINX Reverse Proxy Node -->
  <g transform="translate(420, 210)">
    <rect width="260" height="230" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <rect width="260" height="40" rx="16" fill="#1e293b" />
    <rect y="24" width="260" height="16" fill="#1e293b" />
    <text x="130" y="27" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">NGINX REVERSE PROXY</text>
    
    <text x="30" y="75" fill="#22c55e" font-family="monospace" font-size="12">✓ Brotli + Gzip Engine</text>
    <text x="30" y="105" fill="#22c55e" font-family="monospace" font-size="12">✓ Rate Limiting (DDoS)</text>
    <text x="30" y="135" fill="#22c55e" font-family="monospace" font-size="12">✓ Automated Let's Encrypt</text>
    <text x="30" y="165" fill="#22c55e" font-family="monospace" font-size="12">✓ Static Assets Micro-cache</text>
    <text x="30" y="195" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">⚡ FastCGI / Upstream Pass</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 685 325 L 815 325" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Application Containers Node -->
  <g transform="translate(820, 200)">
    <rect width="260" height="250" rx="16" fill="#111827" stroke="#22c55e" stroke-width="2" />
    <rect width="260" height="40" rx="16" fill="#14532d" />
    <rect y="24" width="260" height="16" fill="#14532d" />
    <text x="130" y="27" fill="#86efac" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">DOCKER ENGINE &amp; APPS</text>
    
    <!-- Box 1 -->
    <rect x="20" y="60" width="220" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="130" y="88" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">Next.js / Astro SSR Node</text>

    <!-- Box 2 -->
    <rect x="20" y="120" width="220" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="130" y="148" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">FastAPI / Go Microservices</text>

    <!-- Box 3 -->
    <rect x="20" y="180" width="220" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="130" y="208" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">Redis &amp; PostgreSQL DB</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(200, 520)">
    <rect width="800" height="80" rx="12" fill="#0b1120" stroke="rgba(255,255,255,0.08)" />
    <text x="130" y="38" fill="#ff5a00" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">99.99%</text>
    <text x="130" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SLA Uptime</text>

    <line x1="260" y1="20" x2="260" y2="60" stroke="rgba(255,255,255,0.1)" />

    <text x="400" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">&lt; 35ms</text>
    <text x="400" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">TTFB Global Cache</text>

    <line x1="530" y1="20" x2="530" y2="60" stroke="rgba(255,255,255,0.1)" />

    <text x="670" y="38" fill="#22c55e" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SSL Grade A+</text>
    <text x="670" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Qualys SSL Labs</text>
  </g>
</svg>
